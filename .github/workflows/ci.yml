name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Static
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run check:static
      - run: npm run check:docs
      - name: ShellCheck infrastructure scripts
        run: find infra/scripts -type f -name '*.sh' -print0 | xargs -0 shellcheck
      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - run: npm run check:infra

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:contracts

  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check API
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run check:ci --workspace @maxim/api

  postgres-races:
    name: PostgreSQL Races
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: race_test
          POSTGRES_USER: maxim_ci
          POSTGRES_PASSWORD: maxim_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=maxim_ci --dbname=race_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://maxim_ci:maxim_ci@127.0.0.1:5432/race_test?schema=public
      CHAT_ROUTING_POSTGRES_RACE_DATABASE_URL: postgresql://maxim_ci:maxim_ci@127.0.0.1:5432/race_test?schema=public
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate Prisma schema and migration policy
        run: npm run check:prisma
      - name: Apply migrations
        run: npm run prisma:migrate:deploy --workspace @maxim/api
      - name: Verify migrated database matches the schema
        run: npm run prisma:check:drift --workspace @maxim/api
      - run: npm run test:postgres-races --workspace @maxim/api

  commercial-benchmark:
    name: Commercial Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      COMMERCIAL_BENCHMARK_PROFILE: github-hosted
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:api:commercial-benchmark:ci

  miniapp:
    name: Mini App
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check:miniapp
      - run: npm run build:miniapp:production
      - run: npm run screenshots:miniapp:smoke

  admin:
    name: Safety Desk
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check:admin

  docker:
    name: Docker (${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: apps/api/Dockerfile
            image_repository: maxim-api
          - component: miniapp
            dockerfile: apps/miniapp/Dockerfile
            image_repository: maxim-miniapp-major
          - component: admin
            dockerfile: apps/admin/Dockerfile
            image_repository: maxim-admin
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Build ${{ matrix.component }} image
        env:
          IMAGE_REF: ${{ matrix.image_repository }}:${{ github.sha }}
        run: |
          docker buildx build --load --provenance=false \
            --label com.maxim.release-protected=true \
            --label org.opencontainers.image.revision="${{ github.sha }}" \
            -f "${{ matrix.dockerfile }}" \
            -t "$IMAGE_REF" \
            .
      - name: Smoke native OCR in API image
        if: matrix.component == 'api'
        env:
          IMAGE_REF: ${{ matrix.image_repository }}:${{ github.sha }}
        run: >-
          docker run --rm --init --read-only
          --cap-drop=ALL
          --security-opt=no-new-privileges
          --pids-limit=128
          --memory=1g
          --cpus=0.75
          --tmpfs /tmp:rw,nosuid,size=64m,uid=1000,gid=1000
          --entrypoint=node
          "$IMAGE_REF"
          apps/api/dist/apps/api/src/scripts/smoke-commercial-ocr-worker.js
      - name: Package immutable production image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_REF: ${{ matrix.image_repository }}:${{ github.sha }}
        run: |
          docker image save "$IMAGE_REF" | gzip -1 > maxim-image.tar.gz
          sha256sum maxim-image.tar.gz > maxim-image.tar.gz.sha256
      - name: Upload immutable production image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maxim-image-${{ matrix.component }}-${{ github.sha }}
          path: |
            maxim-image.tar.gz
            maxim-image.tar.gz.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  required:
    name: Required
    if: always()
    runs-on: ubuntu-latest
    needs:
      - static
      - contracts
      - api
      - postgres-races
      - commercial-benchmark
      - miniapp
      - admin
      - docker
    steps:
      - name: Require every CI lane
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          API_RESULT: ${{ needs.api.result }}
          POSTGRES_RESULT: ${{ needs.postgres-races.result }}
          BENCHMARK_RESULT: ${{ needs.commercial-benchmark.result }}
          MINIAPP_RESULT: ${{ needs.miniapp.result }}
          ADMIN_RESULT: ${{ needs.admin.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
        run: |
          for result in \
            "$STATIC_RESULT" \
            "$CONTRACTS_RESULT" \
            "$API_RESULT" \
            "$POSTGRES_RESULT" \
            "$BENCHMARK_RESULT" \
            "$MINIAPP_RESULT" \
            "$ADMIN_RESULT" \
            "$DOCKER_RESULT"; do
            test "$result" = "success"
          done
