name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  impact:
    name: Change impact
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      static: ${{ steps.plan.outputs.static }}
      contracts: ${{ steps.plan.outputs.contracts }}
      api: ${{ steps.plan.outputs.api }}
      postgres_races: ${{ steps.plan.outputs.postgres_races }}
      commercial_benchmark: ${{ steps.plan.outputs.commercial_benchmark }}
      miniapp: ${{ steps.plan.outputs.miniapp }}
      admin: ${{ steps.plan.outputs.admin }}
      eraser: ${{ steps.plan.outputs.eraser }}
      docker: ${{ steps.plan.outputs.docker }}
      docker_matrix: ${{ steps.plan.outputs.docker_matrix }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - id: plan
        run: node scripts/ci/impact.mjs plan

  static:
    name: Static (${{ matrix.part }})
    needs: impact
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.impact.outputs.plan).mode == 'full' && fromJSON('["core","infra"]') || fromJSON('["core"]') }}
    # FLAG: Full plans require both bounded parts through needs.static in Required.
    # Keep their test inventories disjoint and preserve the per-job time budget.
    # FLAG: Public test commands bound file concurrency. Native/WASM fixtures keep
    # Node's default runtime pools, independently of that process concurrency limit.
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit
      - name: Fast source and generated-input preflight
        run: node scripts/agent/preflight.mjs
      - name: Audit production dependencies
        if: matrix.part == 'core'
        run: npm audit --omit=dev --audit-level=high
      - run: npm run check:static:ci
        if: matrix.part == 'core'
      - run: npm run check:docs
        if: matrix.part == 'core'
      - name: Validate GitHub Actions workflows
        if: matrix.part == 'infra'
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Prepare private Redis infrastructure fixtures
        if: matrix.part == 'infra'
        run: |
          if ! command -v redis-server >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends redis-server
          fi
      - run: npm run check:infra
        if: matrix.part == 'infra'

  contracts:
    name: Contracts
    needs: impact
    if: needs.impact.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit
      - run: npm run check:contracts

  api:
    name: API
    needs: impact
    if: needs.impact.outputs.api == 'true'
    runs-on: ubuntu-latest
    # Include full API validation, Redis integration and runner cleanup.
    timeout-minutes: 30
    services:
      redis:
        image: redis:7-alpine
        ports:
          - '127.0.0.1:6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit
      - name: Check API
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run check:ci --workspace @maxim/api
      - name: Check duplicate, interval and Publisher pause flows with Redis
        env:
          MAXIM_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: npm test --workspace @maxim/api -- 'message-duplicate|photo-duplicate-history.redis|rule-engine-media-cooldown.redis|traffic-protection.redis|publisher-dispatch-health.redis|chat-context-cache.redis|publisher-refresh-operation.redis|publisher-access-refresh.redis|commercial-ocr-admission.redis|marketplace-publisher-access.redis|statistics-access-demand.redis-integration|retention-priority-admission.redis-integration|message-retention-admission.redis-integration|commercial-llm-workstation'

  postgres-races:
    name: PostgreSQL Races (${{ matrix.shard }})
    needs: impact
    if: needs.impact.outputs.postgres_races == 'true'
    runs-on: ubuntu-latest
    # FLAG: Each shard owns its PostgreSQL/Redis services; race suites stay serial inside it.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1/8, 2/8, 3/8, 4/8, 5/8, 6/8, 7/8, 8/8, compatibility]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: race_test
          POSTGRES_USER: maxim_ci
          POSTGRES_PASSWORD: maxim_ci
          TZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=maxim_ci --dbname=race_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TZ: UTC
      MAXIM_TEST_REDIS_URL: redis://127.0.0.1:6379
      DATABASE_URL: postgresql://maxim_ci:maxim_ci@127.0.0.1:5432/race_test?schema=public
      CHAT_ROUTING_POSTGRES_RACE_DATABASE_URL: postgresql://maxim_ci:maxim_ci@127.0.0.1:5432/race_test?schema=public
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install owned Redis process for crash and RDB restore acceptance
        run: |
          if ! command -v redis-server >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends redis-server
          fi
      - run: npm ci --no-audit
      - name: Validate Prisma schema and migration policy
        run: npm run check:prisma
      - name: Apply migrations
        run: npm run prisma:migrate:deploy --workspace @maxim/api
      - name: Verify migrated database matches the schema
        run: npm run prisma:check:drift --workspace @maxim/api
      - name: Outcome cohort online migrations with native PostgreSQL
        if: matrix.shard == 'compatibility'
        env:
          MAXIM_TEST_POSTGRES_URL: ${{ env.DATABASE_URL }}
          TZ: UTC
        run: node --test --test-concurrency=1 infra/scripts/outcome-cohort-online.native.test.mjs infra/scripts/outcome-cohort-historical.native.test.mjs
      - name: Selected Publisher target cancellation with native PostgreSQL
        if: matrix.shard == 'compatibility'
        env:
          MAXIM_TEST_POSTGRES_URL: ${{ env.DATABASE_URL }}
          TZ: UTC
        run: node --test --test-concurrency=1 infra/scripts/publisher-cancel-selected-targets.native.test.mjs
      - name: Quarantine proof bounds with native PostgreSQL
        if: matrix.shard == 'compatibility'
        env:
          MAXIM_TEST_POSTGRES_URL: ${{ env.DATABASE_URL }}
          TZ: UTC
        run: node --test --test-concurrency=1 infra/scripts/webhook-quarantine-proof-audit.test.mjs infra/scripts/webhook-recovery-key-cohort-audit.test.mjs
      - name: Shared statistics with native PostgreSQL
        if: matrix.shard == 'compatibility'
        env:
          MAXIM_TEST_POSTGRES_URL: ${{ env.DATABASE_URL }}
          TZ: UTC
        run: |
          npm test --workspace @maxim/api -- 'integrations/(marketplace|karavan-marketplace)/.*postgres|statistics/.*postgres'
          node --test --test-concurrency=1 infra/scripts/statistics-exchange-audit.test.mjs infra/scripts/central-statistics-audit.test.mjs
      - name: Native race shard
        if: matrix.shard != 'compatibility'
        run: npm run test:postgres-races --workspace @maxim/api -- -- --shard=${{ matrix.shard }} --json --outputFile=postgres-races.json
      - name: Check traffic policy revision and activation guards
        if: matrix.shard == 'compatibility'
        env:
          MAXIM_TEST_POSTGRES_URL: ${{ env.DATABASE_URL }}
        run: npm test --workspace @maxim/api -- traffic-protection.migration-integration.spec.ts
      - name: Participant report SQL, shared executor, journal and retention
        if: matrix.shard == 'compatibility'
        env:
          TZ: UTC
        run: npm test --workspace @maxim/api -- 'moderation/reports/.*postgres'
      - name: Retention admission and receipt recovery with PostgreSQL
        if: matrix.shard == 'compatibility'
        env:
          MAXIM_TEST_POSTGRES_URL: ${{ env.DATABASE_URL }}
        run: npm run test:retention-storage --workspace @maxim/api
      - name: Conservative moderation rollup compatibility with PostgreSQL
        if: matrix.shard == 'compatibility'
        env:
          MAXIM_TEST_POSTGRES_URL: ${{ env.DATABASE_URL }}
          TZ: UTC
        run: npm test --workspace @maxim/api -- chat-moderation-rollup-postgres.spec.ts

      - name: Save native shard result
        if: always() && matrix.shard != 'compatibility'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: postgres-races-${{ strategy.job-index }}-${{ github.sha }}
          path: apps/api/postgres-races.json
          if-no-files-found: warn
          retention-days: 3

  commercial-benchmark:
    name: Commercial Benchmark
    needs: impact
    if: needs.impact.outputs.commercial_benchmark == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      COMMERCIAL_BENCHMARK_PROFILE: github-hosted
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit
      - run: npm run test:api:commercial-benchmark:ci

  miniapp:
    name: Mini App (${{ matrix.shard }})
    needs: impact
    if: needs.impact.outputs.miniapp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # FLAG: Keep every browser case while bounding each serial runner below the
    # job deadline; the aggregate Required check waits for both shards.
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit
      - name: Use HTTPS for browser dependencies
        run: |
          for apt_source_file in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [[ -f "$apt_source_file" ]]; then
              sudo sed -i -E 's#https?://(azure\.)?archive\.ubuntu\.com/#https://archive.ubuntu.com/#g; s#http://security\.ubuntu\.com/#https://security.ubuntu.com/#g' "$apt_source_file"
            fi
          done
          printf '%s\n' 'Acquire::Languages "none";' 'Acquire::http::Timeout "15";' 'Acquire::https::Timeout "15";' 'Acquire::Retries "1";' 'APT::Update::Error-Mode "any";' | sudo tee /etc/apt/apt.conf.d/99maxim-browser >/dev/null
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 3
      - run: npm run check:miniapp
        if: matrix.shard == '1/2'
      - run: npm run build:miniapp:production
        if: matrix.shard == '1/2'
      - run: npm run screenshots:miniapp:smoke
        if: matrix.shard == '1/2'
      - name: Build browser contracts
        if: matrix.shard == '2/2'
        run: npm run build --workspace @maxim/contracts
      - name: Saved catalogs and selected settings access on mobile
        if: matrix.shard == '1/2'
        run: node apps/miniapp/test/personal-access-entry.browser.mjs
      - name: Community titles and avatars on mobile
        if: matrix.shard == '1/2'
        run: node apps/miniapp/test/entity-presentation.browser.mjs
      - name: Moderator selection and interrupted response recovery
        if: matrix.shard == '1/2'
        run: node apps/miniapp/test/moderator-choice.browser.mjs
      - name: Participant report mobile settings and journal
        if: matrix.shard == '1/2'
        run: node apps/miniapp/test/settings-reports.browser.mjs
      - name: Participant report journal polling and response races
        if: matrix.shard == '1/2'
        run: node apps/miniapp/test/report-journal-races.browser.mjs
      - name: Required subscription drafts and response races
        if: matrix.shard == '1/2'
        run: node apps/miniapp/test/settings-required-subscription.browser.mjs
      - name: Settings draft saves and response races
        if: matrix.shard == '1/2'
        run: node apps/miniapp/test/settings-draft.browser.mjs
      - name: Cold settings search layout and focus
        if: matrix.shard == '2/2'
        run: node apps/miniapp/test/settings-search-layout.browser.mjs
      - name: Anti-duplicate controls, schedule and save conflicts
        if: matrix.shard == '2/2'
        run: node apps/miniapp/test/settings-antiduplicate.browser.mjs
      - name: Anti-duplicate diagnostics save and stale responses
        if: matrix.shard == '2/2'
        run: node apps/miniapp/test/settings-duplicate-diagnostics.browser.mjs
      - name: Rules drafts, publication races and image preparation
        if: matrix.shard == '2/2'
        run: |
          node apps/miniapp/test/settings-rules.browser.mjs
          node apps/miniapp/test/rules-image-picker.browser.mjs
      - name: Publication feed filters, cursors and calendar scope
        if: matrix.shard == '2/2'
        run: node apps/miniapp/test/publication-list.browser.mjs
      - name: Publication action confirmations and request identity
        if: matrix.shard == '2/2'
        run: node apps/miniapp/test/publication-actions.browser.mjs
      - name: Publication editor drafts and session lifecycle
        if: matrix.shard == '2/2'
        run: |
          node apps/miniapp/test/publication-session.browser.mjs
          node apps/miniapp/test/publication-video-picker.browser.mjs
          node apps/miniapp/test/publication-composer-usability.browser.mjs
      - name: Rich text formatting, typing state and imported drafts
        if: matrix.shard == '2/2'
        run: node apps/miniapp/test/max-rich-text-formatting.browser.mjs
      - name: Speech styles and custom message preservation
        if: matrix.shard == '2/2'
        run: node apps/miniapp/test/bot-speech-style.browser.mjs

  admin:
    name: Safety Desk
    needs: impact
    if: needs.impact.outputs.admin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit
      - name: Use HTTPS for browser dependencies
        run: |
          for apt_source_file in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [[ -f "$apt_source_file" ]]; then
              sudo sed -i -E 's#https?://(azure\.)?archive\.ubuntu\.com/#https://archive.ubuntu.com/#g; s#http://security\.ubuntu\.com/#https://security.ubuntu.com/#g' "$apt_source_file"
            fi
          done
          printf '%s\n' 'Acquire::Languages "none";' 'Acquire::http::Timeout "15";' 'Acquire::https::Timeout "15";' 'Acquire::Retries "1";' 'APT::Update::Error-Mode "any";' | sudo tee /etc/apt/apt.conf.d/99maxim-browser >/dev/null
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 3
      - run: npm run check:admin

  eraser:
    name: Lastik
    needs: impact
    if: needs.impact.outputs.eraser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eraser_test
          POSTGRES_PASSWORD: eraser_test
          POSTGRES_DB: eraser_test
          TZ: UTC
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U eraser_test -d eraser_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - '127.0.0.1:6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit
      - run: npm run check:eraser
      - name: Validate independent PostgreSQL and Redis lifecycle
        env:
          TZ: UTC
          MAXIM_TEST_POSTGRES_URL: postgresql://eraser_test:eraser_test@127.0.0.1:5432/eraser_test
          MAXIM_TEST_REDIS_URL: redis://127.0.0.1:6379/15
        run: npm run test:stores --workspace @maxim/eraser

  docker:
    name: Docker (${{ matrix.component }})
    needs: impact
    if: needs.impact.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.impact.outputs.docker_matrix) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: matrix.component == 'api'
        with:
          node-version-file: .nvmrc
      - name: Restore trusted dependency build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/maxim-buildx-cache
          key: maxim-buildx-main-v1-${{ matrix.component }}-${{ runner.os }}-amd64-${{ hashFiles('package.json', 'package-lock.json', 'apps/*/package.json', 'packages/*/package.json', matrix.dockerfile, 'infra/certs/*.pem') }}
      - name: Create isolated image builder
        run: docker buildx create --name maxim-ci --driver docker-container --use
      - name: Build ${{ matrix.component }} image
        env:
          IMAGE_REF: ${{ matrix.image_repository }}:${{ github.sha }}
          VITE_API_BASE: ${{ matrix.vite_api_base }}
          TRUSTED_BUILD_CACHE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          BUILD_CACHE_PATH: ${{ runner.temp }}/maxim-buildx-cache
        run: |
          build_args=(--build-arg "COMMIT_SHA=${{ github.sha }}")
          if [[ -n "$VITE_API_BASE" ]]; then
            build_args+=(--build-arg "VITE_API_BASE=$VITE_API_BASE")
          fi
          cache_args=()
          if [[ "$TRUSTED_BUILD_CACHE" == 'true' ]]; then
            if [[ -f "$BUILD_CACHE_PATH/index.json" ]]; then
              cache_args+=(--cache-from "type=local,src=$BUILD_CACHE_PATH")
            else
              cache_args+=(--cache-to "type=local,dest=$BUILD_CACHE_PATH,mode=max")
            fi
          fi
          docker buildx build --load --provenance=false --platform linux/amd64 \
            --label com.maxim.release-protected=true \
            --label org.opencontainers.image.revision="${{ github.sha }}" \
            "${cache_args[@]}" \
            "${build_args[@]}" \
            -f "${{ matrix.dockerfile }}" \
            -t "$IMAGE_REF" \
            .
      - name: Smoke native OCR in API image
        if: matrix.component == 'api'
        env:
          IMAGE_REF: ${{ matrix.image_repository }}:${{ github.sha }}
        run: |
          sandbox_name=maxim-ocr-native-sandbox-ci
          socket_volume=maxim-ocr-native-ipc-ci
          socket_path=/run/maxim-ocr/native-ocr.sock
          entrypoint=apps/api/dist/apps/api/src/moderation/commercial-ocr/native-ocr-sandbox.entrypoint.js
          smoke=apps/api/dist/apps/api/src/scripts/smoke-commercial-ocr-worker.js
          cleanup() {
            docker rm -f "$sandbox_name" >/dev/null 2>&1 || true
            docker volume rm "$socket_volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          cleanup
          docker volume create "$socket_volume" >/dev/null
          native_env=(
            --env NODE_ENV=production
            --env COMMERCIAL_OCR_NATIVE_SANDBOX_SOCKET_PATH="$socket_path"
            --env PHOTO_DUPLICATE_MAX_BYTES=16777216
            --env COMMERCIAL_OCR_MAX_INPUT_PIXELS=40000000
            --env COMMERCIAL_OCR_MAX_OUTPUT_PIXELS=3000000
            --env COMMERCIAL_OCR_MAX_SIDE=2000
            --env COMMERCIAL_OCR_TESSERACT_BINARY=tesseract
            --env COMMERCIAL_OCR_TESSERACT_CONCURRENCY=1
            --env COMMERCIAL_OCR_TESSERACT_MAX_QUEUE=4
            --env COMMERCIAL_OCR_TESSERACT_RECYCLE_AFTER_JOBS=250
            --env COMMERCIAL_OCR_TESSERACT_TIMEOUT_MS=10000
            --env COMMERCIAL_OCR_TESSERACT_MAX_IMAGE_BYTES=16777216
            --env COMMERCIAL_OCR_TESSERACT_MAX_OUTPUT_BYTES=4194304
            --env OMP_THREAD_LIMIT=1
          )
          sandbox_flags=(
            --init
            --read-only
            --user 1000:1000
            --network none
            --label com.maxim.ocr-native-sandbox=true
            --cap-drop ALL
            --security-opt no-new-privileges
            --pids-limit 128
            --memory 1g
            --cpus 1
            --tmpfs '/tmp:rw,nosuid,size=64m,uid=1000,gid=1000'
            --mount "type=volume,source=$socket_volume,target=/run/maxim-ocr"
          )
          docker run -d --name "$sandbox_name" \
            "${sandbox_flags[@]}" "${native_env[@]}" \
            --entrypoint node "$IMAGE_REF" "$entrypoint" >/dev/null
          probe_ok=0
          for attempt in $(seq 1 30); do
            if docker run --rm --init --read-only --user 1000:1000 --network none \
              --cap-drop ALL --security-opt no-new-privileges \
              --mount type=volume,source="$socket_volume",target=/run/maxim-ocr,readonly \
              "${native_env[@]}" --entrypoint node "$IMAGE_REF" "$entrypoint" --probe; then
              probe_ok=1
              break
            fi
            [[ "$attempt" -eq 30 ]] || sleep 1
          done
          [[ "$probe_ok" -eq 1 ]]
          docker run --rm --init --read-only --user 1000:1000 --network none \
            --cap-drop ALL --security-opt no-new-privileges \
            --mount type=volume,source="$socket_volume",target=/run/maxim-ocr,readonly \
            "${native_env[@]}" \
            --env APP_SERVICE_NAME=api-media-analysis --env APP_ROLE=moderation \
            --entrypoint node "$IMAGE_REF" "$smoke"
          docker inspect --format \
            '{{.HostConfig.NetworkMode}}|{{.HostConfig.ReadonlyRootfs}}|{{.HostConfig.PidsLimit}}|{{.HostConfig.Memory}}|{{.HostConfig.NanoCpus}}|{{.Config.User}}|{{index .Config.Labels "com.maxim.ocr-native-sandbox"}}|{{index .Config.Labels "com.maxim.ocr-native-sandbox-capable"}}' \
            "$sandbox_name" | grep -Fx 'none|true|128|1073741824|1000000000|1000:1000|true|true'
          docker top "$sandbox_name" -eo pid,comm | awk 'NR > 1 && $2 == "tesseract" { found=1 } END { exit found ? 1 : 0 }'
      - name: Verify photo native isolation and fault recovery in API image
        if: matrix.component == 'api'
        env:
          IMAGE_REF: ${{ matrix.image_repository }}:${{ github.sha }}
        run: bash infra/scripts/smoke-photo-native-ci.sh "$IMAGE_REF"
      - name: Measure isolated photo and OCR together
        if: matrix.component == 'api'
        env:
          IMAGE_REF: ${{ matrix.image_repository }}:${{ github.sha }}
        run: bash infra/scripts/benchmark-antiduplicate-mixed-native-ci.sh "$IMAGE_REF"
      - name: Verify readonly multibot migration clients and exact cancellation in API image
        if: matrix.component == 'api'
        env:
          IMAGE_REF: ${{ matrix.image_repository }}:${{ github.sha }}
        run: bash infra/scripts/smoke-multibot-online-client-ci.sh "$IMAGE_REF"
      - name: Verify fixed outcome cohort clients and immutable receipts in API image
        if: matrix.component == 'api'
        env:
          IMAGE_REF: ${{ matrix.image_repository }}:${{ github.sha }}
        run: bash infra/scripts/smoke-outcome-cohort-online-client-ci.sh "$IMAGE_REF"
      - name: Verify exact v2 cancellation with native stores and same-generation restoration
        if: matrix.component == 'api'
        env:
          IMAGE_REF: ${{ matrix.image_repository }}:${{ github.sha }}
        run: bash infra/scripts/smoke-backlog-cancellation-v2-ci.sh "$IMAGE_REF"
      - name: Package immutable production image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_REF: ${{ matrix.image_repository }}:${{ github.sha }}
        run: |
          docker image save "$IMAGE_REF" | gzip -1 > maxim-image.tar.gz
          sha256sum maxim-image.tar.gz > maxim-image.tar.gz.sha256
          docker image inspect --format '{{json .RootFS.Layers}}' "$IMAGE_REF" > maxim-image-layers.json
      - name: Upload immutable production image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maxim-image-${{ matrix.component }}-${{ github.sha }}
          path: |
            maxim-image.tar.gz
            maxim-image.tar.gz.sha256
            maxim-image-layers.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  required:
    name: Required
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs:
      - impact
      - static
      - contracts
      - api
      - postgres-races
      - commercial-benchmark
      - miniapp
      - admin
      - eraser
      - docker
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Require selected CI lanes and verify every skip
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/impact.mjs verify
