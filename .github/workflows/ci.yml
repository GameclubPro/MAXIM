name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: race_test
          POSTGRES_USER: maxim_ci
          POSTGRES_PASSWORD: maxim_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=maxim_ci --dbname=race_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Refactor guards
        run: npm run check:refactor-guards

      - name: Typecheck
        run: npm run typecheck

      - name: Test API
        run: npm run test:api:ci

      - name: Migrate disposable PostgreSQL race-test database
        env:
          DATABASE_URL: postgresql://maxim_ci:maxim_ci@127.0.0.1:5432/race_test?schema=public
        run: npm run prisma:migrate:deploy --workspace @maxim/api

      - name: Test PostgreSQL routing races
        env:
          DATABASE_URL: postgresql://maxim_ci:maxim_ci@127.0.0.1:5432/race_test?schema=public
          CHAT_ROUTING_POSTGRES_RACE_DATABASE_URL: postgresql://maxim_ci:maxim_ci@127.0.0.1:5432/race_test?schema=public
        run: npm run test:postgres-races --workspace @maxim/api

      - name: Benchmark commercial moderation
        env:
          COMMERCIAL_BENCHMARK_PROFILE: github-hosted
        run: npm run test:api:commercial-benchmark:ci

      - name: Test mini app
        run: npm run test:miniapp

      - name: Test Safety Desk
        run: npm run test:admin

      - name: Build
        run: npm run build

      - name: Build Docker images
        run: npm run build:docker
