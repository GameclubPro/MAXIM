name: Deploy

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Git branch to deploy
        required: true
        default: main
      services:
        description: Space-separated service names. Leave empty to deploy the default production set.
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS host key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat >> ~/.ssh/known_hosts <<'EOF'
          |1|97a4WMn7yX4SrWNZ1P0VisINiR0=|ifKo4Wsuqnq/zopb3H8fmVX8lqs= ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOVQjSSJayIsncooPq9K+lQta7eoT18CITzjUJmK+s88
          |1|SOZGHrYJ4748YQOvYVCu73LPvk0=|W77O+FAiMQVYWlftExOPsBqrc7o= ssh-rsa 
          |1|uwLn89MsePa+zvlMQ704Glcy2NI=|3cYQBeFwSfqTN6DHBsMsr9NIU1Q= ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBNspkGDub5kCLjRnCLBM7/9HPfU3tUMKFxgY7p75Su5DnVkgIqd3aBDIyECjEwFkiSAELTmYELNPxRslkY8Z2no=
          |1|6OniX/GXXUrfezHMGGy692M50iA=|ev9sn/wdf1hBfoAr8zRET2qfLWk= ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINsUPRi/uU/hYyMMHeXReJpODY+mQh5W9zAxspQPtDFk
          |1|BZiQ2B2lDYOiEsxyPdWAUnli43A=|QbXMj4ln2je4FpcO5T7Y6cfQQyE= ssh-rsa 
          |1|m3kGKva5hpFWUA5uFp1u9BFwevQ=|yox5G1dshzqU4eVmk2ZUlx+nz2s= ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBKoTVRNOVzJj1f9EEQY3PyRVPBvGL4R/ibW0xns2ZCjzrutEZD/Bc1uwxaeKut0DD0lVHTonPKQ/jPKHSBIuwTU=
          EOF
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy on VPS
        env:
          DEPLOY_BRANCH: ${{ inputs.branch }}
          DEPLOY_SERVICES: ${{ inputs.services }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          if [[ -z "$VPS_HOST" || -z "$VPS_PATH" || -z "$VPS_USER" ]]; then
            echo "Missing one of the required VPS secrets: VPS_HOST, VPS_PATH, VPS_USER."
            exit 1
          fi

          SSH_OPTS=(
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o ConnectTimeout=30
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=3
            -p "$VPS_SSH_PORT"
          )

          remote_args=(./infra/scripts/vps-pull-build-up.sh "$DEPLOY_BRANCH")
          if [[ -n "$DEPLOY_SERVICES" ]]; then
            read -r -a service_args <<<"$DEPLOY_SERVICES"
            remote_args+=("${service_args[@]}")
          fi

          printf -v remote_command "%q " "${remote_args[@]}"
          ssh "${SSH_OPTS[@]}" "$VPS_USER@$VPS_HOST" \
            "cd $(printf '%q' "$VPS_PATH") && $remote_command"
