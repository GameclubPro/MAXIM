server {
  listen 3000;
  server_name _;

  root /usr/share/nginx/html;
  charset utf-8;
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

  location = /index.html {
    gzip off;
    try_files $uri =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
  }

  location ~ ^/assets/.+\.(js|css)$ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  location / {
    gzip off;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
  }
}
