<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f3f6f8" />
    <style>
      html,
      body {
        background: #f3f6f8;
      }

      @media (prefers-color-scheme: dark) {
        html:not([data-max-theme='light']),
        html:not([data-max-theme='light']) body {
          background: #0d141b;
        }
      }

      html[data-max-theme='dark'],
      html[data-max-theme='dark'] body {
        background: #0d141b;
      }
    </style>
    <script>
      (() => {
        const root = document.documentElement;
        const normalizeTheme = (value) => {
          const normalized = typeof value === 'string' ? value.trim().toLowerCase() : '';
          return normalized === 'dark' || normalized === 'light' ? normalized : null;
        };
        const bridge = window.MAX?.WebApp ?? window.WebApp;
        const theme =
          normalizeTheme(root.dataset.maxTheme) ??
          normalizeTheme(bridge?.colorScheme ?? bridge?.color_scheme ?? bridge?.theme) ??
          (window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        root.dataset.maxTheme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', theme === 'dark' ? '#0d141b' : '#f3f6f8');
      })();
    </script>
    <meta
      name="description"
      content="Майор Максимов: мини-приложение для управления чатами, каналами и настройками бота в MAX."
    />
    <meta name="application-name" content="Майор Максимов" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Майор Максимов" />
    <meta
      property="og:description"
      content="Мини-приложение для управления чатами, каналами и настройками бота в MAX."
    />
    <meta property="og:url" content="https://major-maksimov.ru/app/" />
    <link rel="canonical" href="https://major-maksimov.ru/app/" />
    <link rel="icon" type="image/png" href="/app/favicon.png" />
    <link rel="apple-touch-icon" href="/app/apple-touch-icon.png" />
    <link rel="manifest" href="/app/site.webmanifest" />
    <title>Майор Максимов</title>
  </head>
  <body>
    <div id="root"></div>
    <script async src="https://st.max.ru/js/max-web-app.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
