services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: maxim
      POSTGRES_PASSWORD: maxim
      POSTGRES_DB: maxim
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api-ingress:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      APP_ROLE: ingress
      MAX_API_GLOBAL_RPS: 30
      MAX_API_GLOBAL_RPS_CRITICAL: 12
      MAX_API_GLOBAL_RPS_INTERACTIVE: 10
      MAX_API_GLOBAL_RPS_BACKGROUND: 4
      MAX_API_CHAT_RPS: 5
      MAX_API_LIST_BOT_CHATS_CACHE_SEC: 120
      MAX_API_CHAT_SNAPSHOT_CACHE_SEC: 300
      MANAGED_ENTITY_HEADER_CACHE_SEC: 3600
    depends_on:
      - postgres
      - redis
    ports:
      - '127.0.0.1:3001:3001'

  api-admin:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      APP_ROLE: admin
      MAX_API_GLOBAL_RPS: 30
      MAX_API_GLOBAL_RPS_CRITICAL: 8
      MAX_API_GLOBAL_RPS_INTERACTIVE: 6
      MAX_API_GLOBAL_RPS_BACKGROUND: 2
      MAX_API_CHAT_RPS: 5
      MAX_API_LIST_BOT_CHATS_CACHE_SEC: 120
      MAX_API_CHAT_SNAPSHOT_CACHE_SEC: 300
      MANAGED_ENTITY_HEADER_CACHE_SEC: 3600
    depends_on:
      - postgres
      - redis
    ports:
      - '127.0.0.1:3002:3001'

  api-enqueue:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      APP_ROLE: enqueue
      ENQUEUE_POLL_INTERVAL_MS: 200
      ENQUEUE_BATCH_SIZE: 400
      ENQUEUE_CONCURRENCY: 32
      MAX_API_GLOBAL_RPS: 30
      MAX_API_GLOBAL_RPS_CRITICAL: 12
      MAX_API_GLOBAL_RPS_INTERACTIVE: 10
      MAX_API_GLOBAL_RPS_BACKGROUND: 4
      MAX_API_CHAT_RPS: 5
      MAX_API_LIST_BOT_CHATS_CACHE_SEC: 120
      MAX_API_CHAT_SNAPSHOT_CACHE_SEC: 300
      MANAGED_ENTITY_HEADER_CACHE_SEC: 3600
    depends_on:
      - postgres
      - redis

  api-moderation:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      APP_ROLE: moderation
      MODERATION_ENABLED_QUEUES: legacy,critical,moderation-default-2,moderation-default-6
      MODERATION_BACKGROUND_TASKS_ENABLED: 'false'
      MODERATION_CONCURRENCY: 16
      MODERATION_CONCURRENCY_LEGACY: 1
      MODERATION_CONCURRENCY_CRITICAL: 4
      MODERATION_CONCURRENCY_DEFAULT_SHARD_2: 1
      MODERATION_CONCURRENCY_DEFAULT_SHARD_6: 1
      REQUIRED_SUBSCRIPTION_LOOKUP_CONCURRENCY: 2
      MAX_MEMBERSHIP_LOOKUP_BATCH_WINDOW_MS: 12
      MAX_MEMBERSHIP_LOOKUP_TIMEOUT_MS_CRITICAL: 2000
      MAX_MEMBERSHIP_LOOKUP_TIMEOUT_MS_INTERACTIVE: 3000
      CHANNEL_AUTO_POST_SCAN_INTERVAL_MS: 30000
      CHANNEL_AUTO_POST_SCAN_MAX_CHANNELS: 8
      CHANNEL_AUTO_POST_INTER_CHANNEL_DELAY_MS: 150
      NIGHT_MODE_SCHEDULED_NOTICE_SPACING_MS: 150
      MAX_API_GLOBAL_RPS: 30
      MAX_API_GLOBAL_RPS_CRITICAL: 12
      MAX_API_GLOBAL_RPS_INTERACTIVE: 10
      MAX_API_GLOBAL_RPS_BACKGROUND: 4
      MAX_API_CHAT_RPS: 5
      MAX_API_LIST_BOT_CHATS_CACHE_SEC: 120
      MAX_API_CHAT_SNAPSHOT_CACHE_SEC: 300
      MANAGED_ENTITY_HEADER_CACHE_SEC: 3600
    depends_on:
      - postgres
      - redis

  api-moderation-realtime-b:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      APP_ROLE: moderation
      MODERATION_ENABLED_QUEUES: moderation-default-0,moderation-default-4
      MODERATION_BACKGROUND_TASKS_ENABLED: 'false'
      MODERATION_CONCURRENCY_DEFAULT_SHARD_0: 1
      MODERATION_CONCURRENCY_DEFAULT_SHARD_4: 1
      REQUIRED_SUBSCRIPTION_LOOKUP_CONCURRENCY: 2
      MAX_MEMBERSHIP_LOOKUP_BATCH_WINDOW_MS: 12
      MAX_MEMBERSHIP_LOOKUP_TIMEOUT_MS_CRITICAL: 2000
      MAX_MEMBERSHIP_LOOKUP_TIMEOUT_MS_INTERACTIVE: 3000
      CHANNEL_AUTO_POST_SCAN_INTERVAL_MS: 30000
      CHANNEL_AUTO_POST_SCAN_MAX_CHANNELS: 8
      CHANNEL_AUTO_POST_INTER_CHANNEL_DELAY_MS: 150
      NIGHT_MODE_SCHEDULED_NOTICE_SPACING_MS: 150
      MAX_API_GLOBAL_RPS: 30
      MAX_API_GLOBAL_RPS_CRITICAL: 12
      MAX_API_GLOBAL_RPS_INTERACTIVE: 10
      MAX_API_GLOBAL_RPS_BACKGROUND: 4
      MAX_API_CHAT_RPS: 5
      MAX_API_LIST_BOT_CHATS_CACHE_SEC: 120
      MAX_API_CHAT_SNAPSHOT_CACHE_SEC: 300
      MANAGED_ENTITY_HEADER_CACHE_SEC: 3600
    depends_on:
      - postgres
      - redis

  api-moderation-realtime-c:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      APP_ROLE: moderation
      MODERATION_ENABLED_QUEUES: moderation-default-1,moderation-default-5
      MODERATION_BACKGROUND_TASKS_ENABLED: 'false'
      MODERATION_CONCURRENCY_DEFAULT_SHARD_1: 1
      MODERATION_CONCURRENCY_DEFAULT_SHARD_5: 1
      REQUIRED_SUBSCRIPTION_LOOKUP_CONCURRENCY: 2
      MAX_MEMBERSHIP_LOOKUP_BATCH_WINDOW_MS: 12
      MAX_MEMBERSHIP_LOOKUP_TIMEOUT_MS_CRITICAL: 2000
      MAX_MEMBERSHIP_LOOKUP_TIMEOUT_MS_INTERACTIVE: 3000
      CHANNEL_AUTO_POST_SCAN_INTERVAL_MS: 30000
      CHANNEL_AUTO_POST_SCAN_MAX_CHANNELS: 8
      CHANNEL_AUTO_POST_INTER_CHANNEL_DELAY_MS: 150
      NIGHT_MODE_SCHEDULED_NOTICE_SPACING_MS: 150
      MAX_API_GLOBAL_RPS: 30
      MAX_API_GLOBAL_RPS_CRITICAL: 12
      MAX_API_GLOBAL_RPS_INTERACTIVE: 10
      MAX_API_GLOBAL_RPS_BACKGROUND: 4
      MAX_API_CHAT_RPS: 5
      MAX_API_LIST_BOT_CHATS_CACHE_SEC: 120
      MAX_API_CHAT_SNAPSHOT_CACHE_SEC: 300
      MANAGED_ENTITY_HEADER_CACHE_SEC: 3600
    depends_on:
      - postgres
      - redis

  api-moderation-realtime-d:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      APP_ROLE: moderation
      MODERATION_ENABLED_QUEUES: moderation-default-3,moderation-default-7
      MODERATION_BACKGROUND_TASKS_ENABLED: 'false'
      MODERATION_CONCURRENCY_DEFAULT_SHARD_3: 1
      MODERATION_CONCURRENCY_DEFAULT_SHARD_7: 1
      REQUIRED_SUBSCRIPTION_LOOKUP_CONCURRENCY: 2
      MAX_MEMBERSHIP_LOOKUP_BATCH_WINDOW_MS: 12
      MAX_MEMBERSHIP_LOOKUP_TIMEOUT_MS_CRITICAL: 2000
      MAX_MEMBERSHIP_LOOKUP_TIMEOUT_MS_INTERACTIVE: 3000
      CHANNEL_AUTO_POST_SCAN_INTERVAL_MS: 30000
      CHANNEL_AUTO_POST_SCAN_MAX_CHANNELS: 8
      CHANNEL_AUTO_POST_INTER_CHANNEL_DELAY_MS: 150
      NIGHT_MODE_SCHEDULED_NOTICE_SPACING_MS: 150
      MAX_API_GLOBAL_RPS: 30
      MAX_API_GLOBAL_RPS_CRITICAL: 12
      MAX_API_GLOBAL_RPS_INTERACTIVE: 10
      MAX_API_GLOBAL_RPS_BACKGROUND: 4
      MAX_API_CHAT_RPS: 5
      MAX_API_LIST_BOT_CHATS_CACHE_SEC: 120
      MAX_API_CHAT_SNAPSHOT_CACHE_SEC: 300
      MANAGED_ENTITY_HEADER_CACHE_SEC: 3600
    depends_on:
      - postgres
      - redis

  api-moderation-background:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      APP_ROLE: moderation
      MODERATION_ENABLED_QUEUES: background
      MODERATION_BACKGROUND_TASKS_ENABLED: 'true'
      MODERATION_CONCURRENCY_BACKGROUND: 2
      REQUIRED_SUBSCRIPTION_LOOKUP_CONCURRENCY: 2
      MAX_MEMBERSHIP_LOOKUP_BATCH_WINDOW_MS: 12
      MAX_MEMBERSHIP_LOOKUP_TIMEOUT_MS_CRITICAL: 2000
      MAX_MEMBERSHIP_LOOKUP_TIMEOUT_MS_INTERACTIVE: 3000
      CHANNEL_AUTO_POST_SCAN_INTERVAL_MS: 30000
      CHANNEL_AUTO_POST_SCAN_MAX_CHANNELS: 8
      CHANNEL_AUTO_POST_INTER_CHANNEL_DELAY_MS: 150
      NIGHT_MODE_SCHEDULED_NOTICE_SPACING_MS: 150
      MAX_API_GLOBAL_RPS: 30
      MAX_API_GLOBAL_RPS_CRITICAL: 12
      MAX_API_GLOBAL_RPS_INTERACTIVE: 10
      MAX_API_GLOBAL_RPS_BACKGROUND: 4
      MAX_API_CHAT_RPS: 5
      MAX_API_LIST_BOT_CHATS_CACHE_SEC: 120
