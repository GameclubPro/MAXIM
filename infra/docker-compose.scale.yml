services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: maxim
      POSTGRES_PASSWORD: maxim
      POSTGRES_DB: maxim
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api-ingress:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      APP_ROLE: ingress
      MAX_API_GLOBAL_RPS: 30
      MAX_API_GLOBAL_RPS_CRITICAL: 12
      MAX_API_GLOBAL_RPS_INTERACTIVE: 10
      MAX_API_GLOBAL_RPS_BACKGROUND: 4
      MAX_API_CHAT_RPS: 5
      MAX_API_LIST_BOT_CHATS_CACHE_SEC: 120
      MAX_API_CHAT_SNAPSHOT_CACHE_SEC: 300
      MANAGED_ENTITY_HEADER_CACHE_SEC: 3600
    depends_on:
      - postgres
      - redis
    ports:
      - '127.0.0.1:3001:3001'

  api-admin:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      APP_ROLE: admin
      MAX_API_GLOBAL_RPS: 30
      MAX_API_GLOBAL_RPS_CRITICAL: 12
      MAX_API_GLOBAL_RPS_INTERACTIVE: 10
      MAX_API_GLOBAL_RPS_BACKGROUND: 4
      MAX_API_CHAT_RPS: 5
      MAX_API_LIST_BOT_CHATS_CACHE_SEC: 120
      MAX_API_CHAT_SNAPSHOT_CACHE_SEC: 300
      MANAGED_ENTITY_HEADER_CACHE_SEC: 3600
    depends_on:
      - postgres
      - redis
    ports:
      - '127.0.0.1:3002:3001'

  api-enqueue:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      APP_ROLE: enqueue
      ENQUEUE_POLL_INTERVAL_MS: 200
      ENQUEUE_BATCH_SIZE: 400
      ENQUEUE_CONCURRENCY: 32
      MAX_API_GLOBAL_RPS: 30
      MAX_API_GLOBAL_RPS_CRITICAL: 12
      MAX_API_GLOBAL_RPS_INTERACTIVE: 10
      MAX_API_GLOBAL_RPS_BACKGROUND: 4
      MAX_API_CHAT_RPS: 5
      MAX_API_LIST_BOT_CHATS_CACHE_SEC: 120
      MAX_API_CHAT_SNAPSHOT_CACHE_SEC: 300
      MANAGED_ENTITY_HEADER_CACHE_SEC: 3600
    depends_on:
      - postgres
      - redis

  api-moderation:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      APP_ROLE: moderation
      MODERATION_CONCURRENCY: 8
      MAX_API_GLOBAL_RPS: 30
      MAX_API_GLOBAL_RPS_CRITICAL: 12
      MAX_API_GLOBAL_RPS_INTERACTIVE: 10
      MAX_API_GLOBAL_RPS_BACKGROUND: 4
      MAX_API_CHAT_RPS: 5
      MAX_API_LIST_BOT_CHATS_CACHE_SEC: 120
      MAX_API_CHAT_SNAPSHOT_CACHE_SEC: 300
      MANAGED_ENTITY_HEADER_CACHE_SEC: 3600
    depends_on:
      - postgres
      - redis

  api-action:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      APP_ROLE: action
      ACTION_CONCURRENCY: 8
      MAX_API_GLOBAL_RPS: 30
      MAX_API_GLOBAL_RPS_CRITICAL: 12
      MAX_API_GLOBAL_RPS_INTERACTIVE: 10
      MAX_API_GLOBAL_RPS_BACKGROUND: 4
      MAX_API_CHAT_RPS: 5
      MAX_API_LIST_BOT_CHATS_CACHE_SEC: 120
      MAX_API_CHAT_SNAPSHOT_CACHE_SEC: 300
      MANAGED_ENTITY_HEADER_CACHE_SEC: 3600
      CHANNEL_STATS_STARTUP_SYNC_ENABLED: 'false'
      CHANNEL_STATS_STARTUP_MAX_CHANNELS: 6
      CHANNEL_STATS_STARTUP_STALE_MS: 21600000
    depends_on:
      - postgres
      - redis

  miniapp-static:
    build:
      context: ..
      dockerfile: apps/miniapp/Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:3000'

volumes:
  postgres_data:
