global
  log /dev/log local0
  log /dev/log local1 notice
  daemon
  user haproxy
  group haproxy

defaults
  mode tcp
  log global
  option tcplog
  timeout connect 5s
  timeout client 60s
  timeout server 60s

frontend maxim_http
  bind *:80
  default_backend maxim_http_backend

backend maxim_http_backend
  server backend 10.130.0.29:80 check

frontend maxim_https
  bind *:443
  tcp-request inspect-delay 1s
  tcp-request content capture req.ssl_sni len 128
  tcp-request content accept if { req_ssl_hello_type 1 }
  tcp-request content accept if WAIT_END
  log-format "%ci:%cp [%t] %ft %b/%s %Tw/%Tc/%Tt %B %ts %ac/%fc/%bc/%sc/%rc %sq/%bq sni:%[capture.req.hdr(0)]"
  default_backend maxim_https_backend

backend maxim_https_backend
  server backend 10.130.0.29:443 check
