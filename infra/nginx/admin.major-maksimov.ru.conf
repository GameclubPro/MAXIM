server {
  listen 80;
  listen [::]:80;
  server_name admin.major-maksimov.ru;
  server_tokens off;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/html;
    default_type text/plain;
    try_files $uri =404;
  }

  location / {
    return 301 https://admin.major-maksimov.ru$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name admin.major-maksimov.ru;
  server_tokens off;

  ssl_certificate /etc/letsencrypt/live/admin.major-maksimov.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/admin.major-maksimov.ru/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:MAJORADMINSSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://major-maksimov.ru; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

  auth_basic "MAXIM Safety Desk";
  auth_basic_user_file /etc/nginx/htpasswd-maxim-admin;

  location = /robots.txt {
    default_type text/plain;
    add_header Cache-Control "public, max-age=3600" always;
    return 200 "User-agent: *\nDisallow: /\n";
  }

  location ^~ /api/v1/safety-desk/ {
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Remote-User $remote_user;
    proxy_set_header Authorization "";
    proxy_read_timeout 60s;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
  }

  location / {
    proxy_pass http://127.0.0.1:3004;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}
