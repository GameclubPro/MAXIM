upstream maxim_api_webhook_ingress {
  server 127.0.0.1:3001;
  keepalive 32;
}

upstream maxim_api_admin_ingress {
  server 127.0.0.1:3002;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name maxim.play-team.ru;
  return 301 https://$host$request_uri;
}

server {
  listen 80;
  listen [::]:80;
  server_name hook.maxim.play-team.ru;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name maxim.play-team.ru;
  server_tokens off;

  ssl_certificate /etc/letsencrypt/live/maxim.play-team.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/maxim.play-team.ru/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:MAXIMSSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  client_max_body_size 6m;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /robots.txt {
    default_type text/plain;
    add_header Cache-Control "public, max-age=3600" always;
    return 200 "User-agent: *\nAllow: /\n";
  }

  location = /favicon.ico {
    return 301 /app/favicon.png;
  }

  location = /apple-touch-icon.png {
    return 301 /app/apple-touch-icon.png;
  }

  location = / {
    return 301 /app/$is_args$args;
  }

  location = /app {
    return 301 /app/$is_args$args;
  }

  location ^~ /api/webhook/ {
    proxy_pass http://maxim_api_webhook_ingress;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Max-Bot-Api-Secret $http_x_max_bot_api_secret;
    proxy_read_timeout 60s;
    add_header X-Maxim-Ingress webhook always;
  }

  location ^~ /api/health/ {
    proxy_pass http://maxim_api_webhook_ingress;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Max-Bot-Api-Secret $http_x_max_bot_api_secret;
    proxy_read_timeout 60s;
    add_header X-Maxim-Ingress webhook always;
  }

  location ^~ /api/v1/ {
    proxy_pass http://maxim_api_admin_ingress;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Max-Bot-Api-Secret $http_x_max_bot_api_secret;
    proxy_read_timeout 60s;
    add_header X-Maxim-Ingress admin always;
  }

  location /api/ {
    proxy_pass http://maxim_api_admin_ingress;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Max-Bot-Api-Secret $http_x_max_bot_api_secret;
    proxy_read_timeout 60s;
    add_header X-Maxim-Ingress admin always;
  }

  location /app/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name hook.maxim.play-team.ru;
  server_tokens off;

  ssl_certificate /etc/letsencrypt/live/maxim.play-team.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/maxim.play-team.ru/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:MAXIMSSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  client_max_body_size 6m;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = / {
    return 404;
  }

  location ^~ /api/webhook/ {
    proxy_pass http://maxim_api_webhook_ingress;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Max-Bot-Api-Secret $http_x_max_bot_api_secret;
    proxy_read_timeout 60s;
    add_header X-Maxim-Ingress webhook always;
  }

  location ^~ /api/health/ {
    proxy_pass http://maxim_api_webhook_ingress;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Max-Bot-Api-Secret $http_x_max_bot_api_secret;
    proxy_read_timeout 60s;
    add_header X-Maxim-Ingress webhook always;
  }

  location / {
    return 404;
  }
}
