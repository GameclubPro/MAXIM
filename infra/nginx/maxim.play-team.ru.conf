upstream maxim_api_webhook_ingress {
  server 127.0.0.1:3001;
  keepalive 32;
}

upstream maxim_api_admin_ingress {
  server 127.0.0.1:3002;
  keepalive 32;
}

upstream reshenie_api_all {
  server 127.0.0.1:3011;
  keepalive 16;
}

upstream reshenie_miniapp {
  server 127.0.0.1:3010;
  keepalive 16;
}

upstream karavan_api_all {
  server 127.0.0.1:3211;
  keepalive 16;
}

upstream karavan_client_miniapp {
  server 127.0.0.1:3210;
  keepalive 16;
}

upstream karavan_seller_miniapp {
  server 127.0.0.1:3212;
  keepalive 16;
}

upstream karavan_seller_web {
  server 127.0.0.1:3213;
  keepalive 16;
}

server {
  listen 80;
  listen [::]:80;
  server_name maxim.play-team.ru;
  return 301 https://$host$request_uri;
}

server {
  listen 80;
  listen [::]:80;
  server_name hook.maxim.play-team.ru;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name maxim.play-team.ru;
  server_tokens off;

  ssl_certificate /etc/letsencrypt/live/maxim.play-team.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/maxim.play-team.ru/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:MAXIMSSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  client_max_body_size 32m;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /robots.txt {
    default_type text/plain;
    add_header Cache-Control "public, max-age=3600" always;
    return 200 "User-agent: *\nAllow: /\n";
  }

  location = /favicon.ico {
    return 308 https://major-maksimov.ru/app/favicon.png;
  }

  location = /apple-touch-icon.png {
    return 308 https://major-maksimov.ru/app/apple-touch-icon.png;
  }

  location = / {
    return 308 https://major-maksimov.ru/app/$is_args$args;
  }

  location = /app {
    return 308 https://major-maksimov.ru/app/$is_args$args;
  }

  location = /reshenie {
    return 301 /reshenie/app/$is_args$args;
  }

  location = /reshenie/app {
    return 301 /reshenie/app/$is_args$args;
  }

  location /reshenie/app/ {
    proxy_pass http://reshenie_miniapp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location ^~ /reshenie/api/ {
    rewrite ^/reshenie(/api/.*)$ $1 break;
    proxy_pass http://reshenie_api_all;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Max-Bot-Api-Secret $http_x_max_bot_api_secret;
    proxy_read_timeout 60s;
    add_header X-Maxim-Ingress reshenie always;
  }

  location = /karavan {
    return 301 /karavan/app/$is_args$args;
  }

  location = /karavan/app {
    return 301 /karavan/app/$is_args$args;
  }

  location = /karavan/seller {
    return 301 /karavan/seller/$is_args$args;
  }

  location = /karavan/web {
    return 301 /karavan/web/$is_args$args;
  }

  location /karavan/app/ {
    proxy_pass http://karavan_client_miniapp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://st.max.ru; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https:; font-src 'self' data:; object-src 'none'; base-uri 'self'" always;
  }

  location /karavan/seller/ {
    proxy_pass http://karavan_seller_miniapp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://st.max.ru; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https:; font-src 'self' data:; object-src 'none'; base-uri 'self'" always;
  }

  location /karavan/web/ {
    proxy_pass http://karavan_seller_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https:; font-src 'self' data:; object-src 'none'; base-uri 'self'" always;
  }

  include /etc/nginx/snippets/karavan-sse-locations.conf;

  location ^~ /karavan/api/ {
    rewrite ^/karavan(/api/.*)$ $1 break;
    proxy_pass http://karavan_api_all;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Max-Bot-Api-Secret $http_x_max_bot_api_secret;
    proxy_read_timeout 60s;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header X-Maxim-Ingress karavan always;
  }

  location ^~ /api/webhook/ {
    proxy_pass http://maxim_api_webhook_ingress;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Max-Bot-Api-Secret $http_x_max_bot_api_secret;
    proxy_connect_timeout 2s;
    proxy_send_timeout 5s;
    proxy_read_timeout 20s;
    add_header X-Maxim-Ingress webhook always;
  }

  location = /api/health/ready {
    return 404;
  }

  location ^~ /api/health/ {
    proxy_pass http://maxim_api_webhook_ingress;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Max-Bot-Api-Secret $http_x_max_bot_api_secret;
    proxy_read_timeout 60s;
    add_header X-Maxim-Ingress webhook always;
  }

  location = /api/v1/safety-desk {
    return 404;
  }

  location ^~ /api/v1/safety-desk/ {
    return 404;
  }

  location = /api/v1/support-requests {
    return 404;
  }

  location ^~ /api/v1/support-requests/ {
    return 404;
  }

  location ^~ /api/v1/ {
    proxy_pass http://maxim_api_admin_ingress;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Remote-User "";
    proxy_set_header X-Max-Bot-Api-Secret $http_x_max_bot_api_secret;
    proxy_read_timeout 60s;
    add_header X-Maxim-Ingress admin always;
  }

  location /api/ {
    proxy_pass http://maxim_api_admin_ingress;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Remote-User "";
    proxy_set_header X-Max-Bot-Api-Secret $http_x_max_bot_api_secret;
    proxy_read_timeout 60s;
    add_header X-Maxim-Ingress admin always;
  }

  location /app/ {
    return 308 https://major-maksimov.ru$request_uri;
  }
}

