server {
  listen 80;
  server_name maxim.play-team.ru;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name maxim.play-team.ru;

  ssl_certificate /etc/letsencrypt/live/maxim.play-team.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/maxim.play-team.ru/privkey.pem;

  client_max_body_size 6m;

  location = / {
    return 302 /app/$is_args$args;
  }

  location = /app {
    return 301 /app/$is_args$args;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Max-Bot-Api-Secret $http_x_max_bot_api_secret;
    proxy_read_timeout 60s;
  }

  location /app/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}
