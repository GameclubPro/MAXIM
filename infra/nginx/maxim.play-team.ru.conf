server {
  listen 80;
  server_name maxim.play-team.ru;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name maxim.play-team.ru;

  ssl_certificate /etc/letsencrypt/live/maxim.play-team.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/maxim.play-team.ru/privkey.pem;

  client_max_body_size 2m;

  location = / {
    return 302 /app/;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:3001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /app/ {
    proxy_pass http://127.0.0.1:3000/app/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
