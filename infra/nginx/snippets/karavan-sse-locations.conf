location = /karavan/api/v1/_mutation-tunnel {
  rewrite ^/karavan(/api/.*)$ $1 break;
  proxy_pass http://127.0.0.1:3211;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Max-Bot-Api-Secret $http_x_max_bot_api_secret;
  proxy_read_timeout 12m;
  proxy_send_timeout 12m;
  proxy_hide_header Strict-Transport-Security;
  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header Referrer-Policy;
  proxy_hide_header X-Frame-Options;
  proxy_hide_header Content-Security-Policy;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
  add_header X-Maxim-Ingress karavan-mutation-tunnel always;
  access_log /var/log/nginx/access.log karavan_no_args;
}

