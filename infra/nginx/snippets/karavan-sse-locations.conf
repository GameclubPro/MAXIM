location = /karavan/api/v1/client/orders/stream {
  rewrite ^/karavan(/api/.*)$ $1 break;
  proxy_pass http://127.0.0.1:3211;
  include /etc/nginx/snippets/karavan-sse-proxy-common.conf;
  proxy_hide_header Strict-Transport-Security;
  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header Referrer-Policy;
  proxy_hide_header X-Frame-Options;
  proxy_hide_header Content-Security-Policy;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
  add_header X-Maxim-Ingress karavan-sse always;
}

