upstream major_maxim_api_webhook_ingress {
  server 127.0.0.1:3001;
  keepalive 32;
}

upstream major_maxim_api_admin_ingress {
  server 127.0.0.1:3002;
  keepalive 32;
}

upstream major_karavan_api_all {
  server 127.0.0.1:3211;
  keepalive 16;
}

upstream major_karavan_client_miniapp {
  server 127.0.0.1:3210;
  keepalive 16;
}

upstream major_karavan_seller_miniapp {
  server 127.0.0.1:3212;
  keepalive 16;
}

upstream major_karavan_seller_web {
  server 127.0.0.1:3213;
  keepalive 16;
}

server {
  listen 80;
  listen [::]:80;
  server_name major-maksimov.ru www.major-maksimov.ru app.major-maksimov.ru;
  server_tokens off;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/html;
    default_type text/plain;
    try_files $uri =404;
  }

  location / {
    return 301 https://major-maksimov.ru$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name www.major-maksimov.ru app.major-maksimov.ru;
  server_tokens off;

  ssl_certificate /etc/letsencrypt/live/major-maksimov.ru-rsa/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/major-maksimov.ru-rsa/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:MAJORSSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/html;
    default_type text/plain;
    try_files $uri =404;
  }

  location / {
    return 301 https://major-maksimov.ru$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name major-maksimov.ru;
  server_tokens off;

  ssl_certificate /etc/letsencrypt/live/major-maksimov.ru-rsa/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/major-maksimov.ru-rsa/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:MAJORSSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  client_max_body_size 32m;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /robots.txt {
    default_type text/plain;
    add_header Cache-Control "public, max-age=3600" always;
    return 200 "User-agent: *\nAllow: /\n";
  }

  location = /ios-canary/ping.txt {
    default_type text/plain;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    return 200 "OK\n";
  }

  location = /ios-canary/canary.html {
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    return 200 "<!doctype html><html lang=\"ru\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"><title>iOS Canary</title></head><body>OK</body></html>\n";
  }

  location = /favicon.ico {
    return 301 /app/favicon.png;
  }

  location = /apple-touch-icon.png {
    return 301 /app/apple-touch-icon.png;
  }

  location = / {
    root /var/www/major-maksimov-site;
    try_files /index.html =404;
    add_header Cache-Control "public, max-age=300" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location = /app {
    return 301 /app/$is_args$args;
  }

  location = /karavan {
    return 301 /karavan/app/$is_args$args;
  }

  location = /karavan/app {
    return 301 /karavan/app/$is_args$args;
  }

  location = /karavan/seller {
    return 301 /karavan/seller/$is_args$args;
  }

  location = /karavan/web {
    return 301 /karavan/web/$is_args$args;
  }

  location ^~ /api/webhook/ {
    proxy_pass http://major_maxim_api_webhook_ingress;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Max-Bot-Api-Secret $http_x_max_bot_api_secret;
    proxy_read_timeout 60s;
    add_header X-Maxim-Ingress webhook always;
  }

  location = /api/health/ready {
    return 404;
  }

  location ^~ /api/health/ {
    proxy_pass http://major_maxim_api_webhook_ingress;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Max-Bot-Api-Secret $http_x_max_bot_api_secret;
    proxy_read_timeout 60s;
    add_header X-Maxim-Ingress webhook always;
  }

  location = /api/v1/safety-desk {
    return 404;
  }

  location ^~ /api/v1/safety-desk/ {
    return 404;
  }

  location = /api/v1/support-requests {
    return 404;
  }

  location ^~ /api/v1/support-requests/ {
    return 404;
  }

  location = /api/v1/channels {
    proxy_pass http://major_maxim_api_admin_ingress;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Remote-User "";
    proxy_set_header X-Max-Bot-Api-Secret $http_x_max_bot_api_secret;
    client_body_timeout 10m;
    proxy_send_timeout 10m;
    proxy_read_timeout 10m;
    add_header X-Maxim-Ingress admin always;
  }

  location ^~ /api/v1/channels/ {
    proxy_pass http://major_maxim_api_admin_ingress;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Remote-User "";
    proxy_set_header X-Max-Bot-Api-Secret $http_x_max_bot_api_secret;
    client_body_timeout 10m;
    proxy_send_timeout 10m;
    proxy_read_timeout 10m;
    add_header X-Maxim-Ingress admin always;
  }

  location ^~ /api/v1/ {
    proxy_pass http://major_maxim_api_admin_ingress;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Remote-User "";
    proxy_set_header X-Max-Bot-Api-Secret $http_x_max_bot_api_secret;
    proxy_read_timeout 60s;
    add_header X-Maxim-Ingress admin always;
  }

  location /api/ {
    proxy_pass http://major_maxim_api_admin_ingress;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Max-Bot-Api-Secret $http_x_max_bot_api_secret;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Remote-User "";
    proxy_read_timeout 60s;
    add_header X-Maxim-Ingress admin always;
  }

  location = /app/manifest.webmanifest {
    return 301 /app/site.webmanifest;
  }

  location ^~ /app/assets/ {
    proxy_pass http://127.0.0.1:3003;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location /app/ {
    proxy_pass http://127.0.0.1:3003;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_set_header Accept-Encoding "";
  }

  location /karavan/app/ {
    proxy_pass http://major_karavan_client_miniapp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://st.max.ru; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https:; font-src 'self' data:; object-src 'none'; base-uri 'self'" always;
  }

  location /karavan/seller/ {
    proxy_pass http://major_karavan_seller_miniapp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://st.max.ru; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https:; font-src 'self' data:; object-src 'none'; base-uri 'self'" always;
  }

  location /karavan/web/ {
    proxy_pass http://major_karavan_seller_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https:; font-src 'self' data:; object-src 'none'; base-uri 'self'" always;
  }

  include /etc/nginx/snippets/karavan-sse-locations.conf;

  location ^~ /karavan/api/ {
    rewrite ^/karavan(/api/.*)$ $1 break;
    proxy_pass http://major_karavan_api_all;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Max-Bot-Api-Secret $http_x_max_bot_api_secret;
    proxy_read_timeout 60s;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header X-Maxim-Ingress karavan-major always;
  }

  location / {
    return 404;
  }
}
