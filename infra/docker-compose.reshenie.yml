services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: maxim
      POSTGRES_PASSWORD: maxim
      POSTGRES_DB: maxim
    volumes:
      - reshenie_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env.reshenie
    environment:
      APP_ROLE: all
      PORT: 3001
      ENQUEUE_POLL_INTERVAL_MS: 300
      ENQUEUE_BATCH_SIZE: 100
      MAX_API_GLOBAL_RPS: 12
      MAX_API_GLOBAL_RPS_CRITICAL: 6
      MAX_API_GLOBAL_RPS_INTERACTIVE: 4
      MAX_API_GLOBAL_RPS_BACKGROUND: 2
      MAX_API_CHAT_RPS: 3
      MAX_API_LIST_BOT_CHATS_CACHE_SEC: 60
      MAX_API_CHAT_SNAPSHOT_CACHE_SEC: 120
      MANAGED_ENTITY_HEADER_CACHE_SEC: 3600
      MODERATION_CONCURRENCY: 4
      ACTION_CONCURRENCY: 4
      CHANNEL_STATS_STARTUP_SYNC_ENABLED: 'false'
      CHANNEL_AUTO_POST_SCAN_MAX_CHANNELS: 2
    depends_on:
      - postgres
      - redis
    ports:
      - '127.0.0.1:3011:3001'

  miniapp-static:
    build:
      context: ..
      dockerfile: apps/miniapp/Dockerfile
      args:
        MINIAPP_BASE_PATH: /reshenie/app/
        VITE_PUBLIC_BASE_PATH: /reshenie/app/
        VITE_API_BASE: /reshenie/api/v1
        VITE_APP_NAME: Решение
        VITE_APP_DESCRIPTION: Мини-приложение для управления чатами, каналами и настройками бота Решение в MAX.
        VITE_APP_CANONICAL_URL: https://maxim.play-team.ru/reshenie/app/
    restart: unless-stopped
    ports:
      - '127.0.0.1:3010:3000'

volumes:
  reshenie_postgres_data:
