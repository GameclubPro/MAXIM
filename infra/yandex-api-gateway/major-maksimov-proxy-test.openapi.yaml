openapi: 3.0.0
info:
  title: Major Maksimov API Gateway reachability test
  version: 1.0.0
x-yc-apigateway:
  ignoreTrailingSlashes: false
paths:
  /:
    x-yc-apigateway-any-method:
      summary: Proxy root requests to the current major-maksimov.ru origin
      x-yc-apigateway-integration:
        type: http
        url: https://major-maksimov.ru/
        headers:
          '*': '*'
          Host: major-maksimov.ru
        query:
          '*': '*'
        timeouts:
          connect: 2
          read: 25
      responses:
        '200':
          description: Proxied response
  /{path+}:
    x-yc-apigateway-any-method:
      summary: Proxy all requests to the current major-maksimov.ru origin
      parameters:
        - name: path
          in: path
          required: false
          schema:
            type: string
      x-yc-apigateway-integration:
        type: http
        url: https://major-maksimov.ru/{path}
        headers:
          '*': '*'
          Host: major-maksimov.ru
        query:
          '*': '*'
        timeouts:
          connect: 2
          read: 25
      responses:
        '200':
          description: Proxied response
