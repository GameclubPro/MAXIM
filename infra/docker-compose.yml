x-spammer-read-model-shadow-env: &spammer-read-model-shadow-env
  NODE_ENV: production
  SPAMMER_PROFILE_CACHE_ENABLED: 'true'
  SPAMMER_READ_MODEL_SHADOW_ENABLED: 'true'
  SPAMMER_READ_MODEL_SHADOW_SAMPLE_RATE: '0.1'
  SPAMMER_READ_MODEL_ENFORCEMENT_ENABLED: 'false'
  SPAMMER_OBSERVATION_DENORM_QUEUE_ENABLED: 'false'
  SPAMMER_OBSERVATION_FAST_PATH_ENABLED: 'false'
  SPAMMER_OBSERVATION_FAST_PATH_SOURCES: COMMERCIAL_AD,COMMERCIAL_CAMPAIGN,REPEATED_LINK,REPEATED_PHONE
  MODERATION_DELETE_INTENT_MODE: ${MODERATION_DELETE_INTENT_MODE:-shadow}
  MODERATION_DELETE_INTENT_CANARY_CHAT_IDS: ${MODERATION_DELETE_INTENT_CANARY_CHAT_IDS:-}
  MODERATION_DELETE_CROSS_BOT_CANARY_CHAT_IDS: ${MODERATION_DELETE_CROSS_BOT_CANARY_CHAT_IDS:-}
  MODERATION_DELETE_INTENT_REPLACEMENT_CLEANUP_ENABLED: ${MODERATION_DELETE_INTENT_REPLACEMENT_CLEANUP_ENABLED:-false}
  COMMERCIAL_OCR_ROLLOUT_MODE: ${COMMERCIAL_OCR_ROLLOUT_MODE:-shadow}
  COMMERCIAL_OCR_CANARY_CHAT_IDS: ${COMMERCIAL_OCR_CANARY_CHAT_IDS:-}
  COMMERCIAL_OCR_VERSION: ${COMMERCIAL_OCR_VERSION:-tesseract-rus-eng-v2}
  COMMERCIAL_OCR_CERTIFICATION_APPROVAL_PUBLIC_KEY_BASE64: ${COMMERCIAL_OCR_CERTIFICATION_APPROVAL_PUBLIC_KEY_BASE64:-}

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: '${DOCKER_LOG_MAX_SIZE:-10m}'
    max-file: '${DOCKER_LOG_MAX_FILE:-5}'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    shm_size: 512m
    environment:
      POSTGRES_USER: maxim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maxim}
      POSTGRES_DB: maxim
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: ['redis-server', '--save', '3600', '1', '--appendonly', 'no']
    stop_grace_period: 15m
    volumes:
      - redis_data:/data

  api-ingress:
    image: ${MAXIM_API_IMAGE:-maxim-api:local}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ${MAXIM_COMPOSE_SERVICE_ENV_FILE:-../.env}
    environment:
      <<: *spammer-read-model-shadow-env
      APP_SERVICE_NAME: api-ingress
      APP_ROLE: ingress
      PRISMA_PG_POOL_MAX: 6
      PRISMA_PG_POOL_IDLE_TIMEOUT_MS: 10000
      PRISMA_PG_POOL_CONNECTION_TIMEOUT_MS: 5000
      MAX_API_GLOBAL_RPS: 30
      MAX_API_GLOBAL_RPS_CRITICAL: 12
      MAX_API_GLOBAL_RPS_INTERACTIVE: 10
      MAX_API_GLOBAL_RPS_BACKGROUND: 4
      MAX_API_CHAT_RPS: 5
      MAX_API_LIST_BOT_CHATS_CACHE_SEC: 120
      MAX_API_CHAT_SNAPSHOT_CACHE_SEC: 300
      MANAGED_ENTITY_HEADER_CACHE_SEC: 3600
    depends_on:
      - postgres
      - redis
    ports:
      - '127.0.0.1:3001:3001'

  api-admin:
    image: ${MAXIM_API_IMAGE:-maxim-api:local}
