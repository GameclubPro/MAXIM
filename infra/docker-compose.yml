      CHANNEL_STATS_STARTUP_SYNC_ENABLED: false
      CHANNEL_STATS_STARTUP_MAX_CHANNELS: 6
      CHANNEL_STATS_STARTUP_STALE_MS: 21600000
      MAX_API_GLOBAL_RPS: 30
      MAX_API_GLOBAL_RPS_CRITICAL: 12
      MAX_API_GLOBAL_RPS_INTERACTIVE: 10
      MAX_API_GLOBAL_RPS_BACKGROUND: 3
      MAX_API_CHAT_RPS: 5
      MAX_API_LIST_BOT_CHATS_CACHE_SEC: 120
      MAX_API_CHAT_SNAPSHOT_CACHE_SEC: 300
      MANAGED_ENTITY_HEADER_CACHE_SEC: 3600
      BACKGROUND_GOVERNOR_BACKGROUND_SHARE_THRESHOLD: 0.2
      BACKGROUND_GOVERNOR_SLOW_RETRY_AFTER_MS: 90000
      BACKGROUND_GOVERNOR_PAUSE_RETRY_AFTER_MS: 180000
      BACKGROUND_GOVERNOR_BOT_LOAD_SLOW_THRESHOLD: 0.25
      BACKGROUND_GOVERNOR_BOT_LOAD_PAUSE_THRESHOLD: 0.5
      BACKGROUND_GOVERNOR_SYSTEM_PRESSURE_ENABLED: 'true'
      BACKGROUND_GOVERNOR_SYSTEM_LOAD_SLOW_THRESHOLD: 0.85
      BACKGROUND_GOVERNOR_SYSTEM_LOAD_PAUSE_THRESHOLD: 1.25
      BACKGROUND_GOVERNOR_IOWAIT_SLOW_THRESHOLD: 0.15
      BACKGROUND_GOVERNOR_IOWAIT_PAUSE_THRESHOLD: 0.35
    depends_on:
      - postgres
      - redis

  miniapp-static:
    image: ${MAXIM_MINIAPP_LEGACY_IMAGE:-maxim-miniapp-legacy:local}
    build:
      context: ..
      dockerfile: apps/miniapp/Dockerfile
      labels:
        com.maxim.release-protected: 'true'
      args:
        VITE_APP_CANONICAL_URL: https://maxim.play-team.ru/app/
    restart: unless-stopped
    logging: *default-logging
    ports:
      - '127.0.0.1:3000:3000'

  miniapp-major-static:
    image: ${MAXIM_MINIAPP_MAJOR_IMAGE:-maxim-miniapp-major:local}
    build:
      context: ..
      dockerfile: apps/miniapp/Dockerfile
      labels:
        com.maxim.release-protected: 'true'
      args:
        VITE_APP_CANONICAL_URL: https://major-maksimov.ru/app/
        VITE_API_BASE: https://major-maksimov.ru/api/v1
    restart: unless-stopped
    logging: *default-logging
    ports:
      - '127.0.0.1:3003:3000'

  admin-static:
    image: ${MAXIM_ADMIN_IMAGE:-maxim-admin:local}
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
      labels:
        com.maxim.release-protected: 'true'
      args:
        ADMIN_BASE_PATH: /
        VITE_PUBLIC_BASE_PATH: /
    restart: unless-stopped
    logging: *default-logging
    ports:
      - '127.0.0.1:3004:3000'

volumes:
  postgres_data:
  redis_data:
