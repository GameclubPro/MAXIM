version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: maxim
      POSTGRES_PASSWORD: maxim
      POSTGRES_DB: maxim
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      - postgres
      - redis
    ports:
      - '3001:3001'

  miniapp-static:
    build:
      context: ..
      dockerfile: apps/miniapp/Dockerfile
    restart: unless-stopped
    ports:
      - '3000:3000'

volumes:
  postgres_data:
