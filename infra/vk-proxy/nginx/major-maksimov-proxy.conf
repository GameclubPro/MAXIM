upstream major_maksim_origin_tls {
  server 84.201.186.244:443;
  keepalive 32;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name major-maksimov.ru 185.241.192.168 _;
  server_tokens off;

  root /var/www/major-maksimov-public;
  client_max_body_size 32m;

  ssl_certificate /etc/letsencrypt/live/major-maksimov.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/major-maksimov.ru/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  proxy_ssl_verify on;
  proxy_ssl_verify_depth 3;
  proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

  location = / {
    try_files /index.html =404;
    add_header Cache-Control "public, max-age=300" always;
  }

  location = /robots.txt {
    default_type text/plain;
    add_header Cache-Control "public, max-age=3600" always;
    return 200 "User-agent: *\nAllow: /\n";
  }

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/html;
    default_type text/plain;
    try_files $uri =404;
  }

  location = /bot.webp {
    try_files /bot.webp =404;
    add_header Cache-Control "public, max-age=86400" always;
  }

  location = /favicon.ico {
    return 301 /app/favicon.png;
  }

  location = /apple-touch-icon.png {
    return 301 /app/apple-touch-icon.png;
  }

  location = /app {
    return 301 /app/$is_args$args;
  }

  location ^~ /api/ {
    proxy_pass https://major_maksim_origin_tls;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name major-maksimov.ru;
    proxy_set_header Host major-maksimov.ru;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Max-Bot-Api-Secret $http_x_max_bot_api_secret;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_buffering off;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header X-Maxim-VK-Proxy "api" always;
  }

  location ^~ /app/ {
    proxy_pass https://major_maksim_origin_tls;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name major-maksimov.ru;
    proxy_set_header Host major-maksimov.ru;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 90s;
    proxy_redirect https://major-maksimov.ru/ https://$host/;
    proxy_set_header Accept-Encoding "";
    sub_filter_once off;
    sub_filter_types text/css application/javascript application/json application/manifest+json;
    sub_filter "https://major-maksimov.ru/app/" "https://$host/app/";
    sub_filter "https://maxim.play-team.ru/app/" "https://$host/app/";
    add_header X-Maxim-VK-Proxy "app" always;
  }

  location / {
    return 404;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name app.major-maksimov.ru www.major-maksimov.ru;
  server_tokens off;

  ssl_certificate /etc/letsencrypt/live/major-maksimov.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/major-maksimov.ru/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/html;
    default_type text/plain;
    try_files $uri =404;
  }

  location / {
    return 301 https://major-maksimov.ru$request_uri;
  }
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name app.major-maksimov.ru major-maksimov.ru www.major-maksimov.ru 185.241.192.168 _;
  server_tokens off;

  location = /robots.txt {
    default_type text/plain;
    add_header Cache-Control "public, max-age=3600" always;
    return 200 "User-agent: *\nAllow: /\n";
  }

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/html;
    default_type text/plain;
    try_files $uri =404;
  }

  location / {
    return 301 https://major-maksimov.ru$request_uri;
  }
}
